<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projeto Portfólio">
    <meta name="author" content="Pâmela dos Reis | Generation Brasil">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <link rel="icon" type="image/svg" href="./assets/img/favicon.svg">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Contato</title>
</head>

<body>

    <header>
        <h1>Generation Brasil</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN empurra o footer -->
    <main class="main_contato">

        <form action="#" method="post" id="formulario">

            <label for="name">Nome:</label>
            <input id="name" type="text" name="name" placeholder="Digite seu nome">
            <span id="errNome"></span>

            <label for="email">Email:</label>
            <input id="email" type="email" name="email" placeholder="Digite seu email">
            <span id="errEmail"></span>

            <label for="subject">Assunto:</label>
            <input id="subject" type="text" name="subject" placeholder="Digite o assunto da mensagem">
            <span id="errSubject"></span>

            <label for="message">Mensagem:</label>
            <textarea id="message" name="message" placeholder="Digite sua mensagem"></textarea>

            <button type="submit">Enviar</button>
        </form>

        <article class="article_mapa">

            <address>
                <p>Av. Paulista, 100</p>
                <p>São Paulo - SP</p>
            </address>

            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3657.106696296001!2d-46.65390548535577!3d-23.564611167596592!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce59c7f481fd9f%3A0x9982bfde4df54830!2sAv.%20Paulista%2C%201000!5e0!3m2!1spt-BR!2sbr!4v1594056507065"
                width="400"
                height="250"
                style="border:0;"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>

        </article>

    </main>

    <footer>

        <section>
            <a href="https://www.linkedin.com/in/p%C3%A2mela-dos-reis/" target="_blank" rel="noopener">
                <img src="assets/img/linkedin.png" alt="LinkedIn">
            </a>

            <a href="https://github.com/pammyu" target="_blank" rel="noopener">
                <img src="assets/img/github.png" alt="GitHub">
            </a>

            <a href="https://www.instagram.com/pamm.desi/" target="_blank" rel="noopener">
                <img src="assets/img/instagram.png" alt="Instagram">
            </a>
        </section>

        <h3>
            Feito com ❤️ por Assis Pires Neto para a Generation Brasil &copy; 2026
        </h3>

    </footer>

    <script src="./assets/js/script.js"></script>
</body>

</html>
