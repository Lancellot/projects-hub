        <main>


            <form action="#" method="submit" id="formulario">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                <span id="errNome"></span>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email" required>
                <span id="errEmail"></span>

                <label for="subject">Assunto:</label>
                <input type="text" id="subject" name="subject" placeholder="Digite o assunto" required>
                <span id="errSubject"></span>

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem" required></textarea>

                <button type="submit">Enviar</button>
            </form>


            <article>
                <address>
                    <p>Av. Paulista, 100</p>
                    <p>São Paulo - SP</p>
                </address>
